name: Update Contribution Hexagon Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate Hexagon SVGs
        run: python3 scripts/generate_hexagon_graph.py

      - name: Refresh Public Repository Counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_star_history.py

      - name: Commit Updated Graphs
        run: |
          git config user.name "AMFI-Disable"
          git config user.email "evengao6688@gmail.com"
          git add readme.md assets/public-stars.json assets/contribution-hexagon-dark.svg assets/contribution-hexagon-light.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update activity graphs"
            git push
          fi
